services:
  - type: web
    name: travel-planner-api
    runtime: python
    pythonVersion: 3.13
    buildCommand: pip install -r requirements.txt gunicorn
    startCommand: gunicorn -w 1 -k uvicorn.workers.UvicornWorker app:app --bind 0.0.0.0:8000
    envVars:
      - key: PYTHON_VERSION
        value: 3.13
